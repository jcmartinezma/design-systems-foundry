<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /*
        Figma plugin UI is a standalone HTML string (no node_modules).
        Values match @jcmartinezma/jcbrand dark theme semantics from tokens.md.
      */
      :root {
        color-scheme: dark;
        --color-bg-primary: #141414;
        --color-bg-secondary: #242424;
        --color-surface-tertiary: #242424;
        --color-surface-tertiary-inverse: #efefef;
        --color-text-primary: #efefef;
        --color-text-secondary: #8a8a8a;
        --color-text-tertiary: #636363;
        --color-text-danger: #cb5c5c;
        --color-text-secondary-inverse: #141414;
        --color-border-secondary: #4a4a4a;
        --color-border-tertiary: #242424;
        --color-border-accent: #7d9420;
        --text-style-base: "Rethink Sans", ui-sans-serif, system-ui, sans-serif;
        --text-style-display: "Rethink Sans", ui-sans-serif, system-ui, sans-serif;
        --text-size-xxs: 12px;
        --text-size-xs: 14px;
        --text-size-sm: 16px;
        --text-weight-normal: 400;
        --text-weight-semibold: 600;
        --text-weight-bold: 700;
        --text-line-height-sm: 18px;
        --text-line-height-md: 21px;
        --text-letter-spacing-normal: 0px;
        --spacing-2xs: 4px;
        --spacing-xs: 8px;
        --spacing-sm: 16px;
        --spacing-md: 24px;
        --border-radius-xs: 4px;
        --border-radius-200: 8px;
        --motion-duration-fast: 0.1s;
        --motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--text-style-base);
        font-size: var(--text-size-xxs);
        font-weight: var(--text-weight-normal);
        line-height: var(--text-line-height-sm);
        letter-spacing: var(--text-letter-spacing-normal);
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
      }
      main {
        height: 100%;
        padding: var(--spacing-md);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
        overflow: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-xs);
        padding-bottom: var(--spacing-2xs);
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: var(--border-radius-xs);
        background: var(--color-surface-tertiary-inverse);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .brand-mark svg { display: block; width: 12px; height: 16px; }
      .brand-name {
        margin: 0;
        font-family: var(--text-style-display);
        font-size: var(--text-size-sm);
        font-weight: var(--text-weight-bold);
        line-height: var(--text-line-height-md);
        letter-spacing: var(--text-letter-spacing-normal);
      }
      .step-meta {
        margin: 0;
        color: var(--color-text-tertiary);
        font-size: var(--text-size-xxs);
        line-height: var(--text-line-height-sm);
      }
      h1 {
        margin: 0;
        font-family: var(--text-style-display);
        font-size: var(--text-size-xs);
        font-weight: var(--text-weight-semibold);
        line-height: var(--text-line-height-sm);
        letter-spacing: var(--text-letter-spacing-normal);
      }
      p { margin: 0; color: var(--color-text-secondary); }
      button, textarea, input[type="text"], input[type="search"] {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--color-border-secondary);
        border-radius: var(--border-radius-xs);
      }
      button {
        height: 32px;
        padding: 0 var(--spacing-xs);
        cursor: pointer;
        transition: background var(--motion-duration-fast) var(--motion-easing-standard),
          border-color var(--motion-duration-fast) var(--motion-easing-standard),
          color var(--motion-duration-fast) var(--motion-easing-standard),
          opacity var(--motion-duration-fast) var(--motion-easing-standard);
      }
      button.primary {
        background: var(--color-surface-tertiary-inverse);
        color: var(--color-text-secondary-inverse);
        border-color: var(--color-surface-tertiary-inverse);
        font-weight: var(--text-weight-semibold);
      }
      button.primary:disabled {
        background: var(--color-bg-secondary);
        color: var(--color-text-tertiary);
        border-color: var(--color-border-tertiary);
        opacity: 1;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      button:focus-visible, textarea:focus-visible, input:focus-visible {
        outline: 2px solid var(--color-border-accent);
        outline-offset: 1px;
      }
      textarea {
        min-height: 96px;
        padding: var(--spacing-xs);
        resize: vertical;
        background: var(--color-bg-secondary);
        border-color: var(--color-border-secondary);
      }
      input[type="text"], input[type="search"] {
        height: 32px;
        width: 100%;
        padding: 0 var(--spacing-xs);
        background: var(--color-bg-secondary);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
        color: var(--color-text-tertiary);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--color-border-secondary);
      }
      .json-box { display: flex; flex-direction: column; gap: var(--spacing-xs); }
      .panel > button.primary, .json-box > button.primary { width: 100%; }
      .panel {
        display: none;
        flex-direction: column;
        gap: var(--spacing-sm);
        flex: 1;
      }
      .panel.active { display: flex; }
      .panel-head {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-2xs);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 280px;
        overflow: auto;
      }
      label {
        display: flex;
        gap: var(--spacing-xs);
        align-items: center;
        padding: 6px var(--spacing-xs);
        border-radius: var(--border-radius-xs);
      }
      label:hover { background: var(--color-bg-secondary); }
      label strong { font-weight: var(--text-weight-semibold); }
      label em {
        color: var(--color-text-tertiary);
        font-style: normal;
        font-size: 11px;
        margin-left: auto;
        white-space: nowrap;
      }
      label small { display: block; color: var(--color-text-tertiary); font-size: 11px; }
      .list label span { display: flex; flex-direction: column; min-width: 0; }
      .list label:has(input:checked) {
        background: var(--color-bg-secondary);
        outline: 1px solid var(--color-border-secondary);
      }
      .error { color: var(--color-text-danger); min-height: var(--text-line-height-sm); }
      .field-error { color: var(--color-text-danger); font-size: 11px; min-height: 14px; }
      .back {
        align-self: flex-start;
        height: 28px;
        padding: 0 var(--spacing-xs);
        border-color: transparent;
        color: var(--color-text-secondary);
      }
      .back:hover { color: var(--color-text-primary); }
      .groups-label {
        color: var(--color-text-primary);
        font-weight: var(--text-weight-semibold);
      }
      .grow { flex: 1; }
    </style>
  </head>
  <body>
    <main>
      <header class="brand" aria-label="Foundry">
        <span class="brand-mark" aria-hidden="true">
          <svg width="12" height="16" viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.38355 11.3333C3.695 11.3333 3.94748 11.6318 3.94748 12V15.3333C3.94748 15.7015 3.695 16 3.38355 16H0.563926C0.252478 16 0 15.7015 0 15.3333V12C0 11.6318 0.252478 11.3333 0.563926 11.3333H3.38355Z" fill="black"/>
            <path d="M7.54636 6C7.75995 6 7.95528 6.14265 8.05081 6.36849L9.17866 9.03516C9.36614 9.47842 9.09342 10 8.67421 10H0.563926C0.252478 10 0 9.70152 0 9.33333V6.66667C3.63315e-08 6.29848 0.252478 6 0.563926 6H7.54636Z" fill="black"/>
            <path d="M9.82574 0C10.0281 8.58332e-05 10.215 0.128236 10.3153 0.335938L11.925 3.66927C12.1397 4.11371 11.8678 4.66667 11.4349 4.66667H0.563926C0.252478 4.66667 0 4.36819 0 4V0.666667C0 0.298477 0.252478 0 0.563926 0H9.82574Z" fill="black"/>
          </svg>
        </span>
        <p class="brand-name">Foundry</p>
      </header>

      <section id="step-read" class="panel active">
        <div class="panel-head">
          <p class="step-meta" id="step-read-meta">Step 1 of 3</p>
          <h1>Data</h1>
          <p>Read the Design Systems on this computer, or paste a JSON export.</p>
        </div>
        <button class="primary" id="load" type="button">Read from Foundry</button>
        <p id="loaded-note" hidden></p>
        <button id="resume" type="button" hidden>Continue</button>
        <div class="divider" aria-hidden="true">OR</div>
        <div class="json-box">
          <textarea id="json" placeholder='{"source":"creator","kind":"library","systems":[...]}' spellcheck="false"></textarea>
          <p class="field-error" id="json-error" aria-live="polite"></p>
          <button class="primary" id="paste-continue" type="button" disabled>Import JSON</button>
        </div>
      </section>

      <section id="step-system" class="panel">
        <button class="back" id="back-system" type="button">← Back</button>
        <div class="panel-head">
          <p class="step-meta">Step 2 of 3</p>
          <h1>System</h1>
          <p>One system goes to Figma. Search by name when the list is long.</p>
        </div>
        <input id="search" type="search" placeholder="Search by name" aria-label="Search design systems by name" />
        <p id="selected-line"></p>
        <p id="systems-empty" hidden>No system matches that name.</p>
        <div id="systems" class="list grow" role="radiogroup" aria-label="Design systems"></div>
        <button class="primary" id="to-create" type="button" disabled>Continue</button>
      </section>

      <section id="step-create" class="panel">
        <button class="back" id="back-create" type="button">← Back</button>
        <div class="panel-head">
          <p class="step-meta">Step 3 of 3</p>
          <h1 id="create-title">Variables</h1>
          <p>Select the tokens you want to import to Figma.</p>
        </div>
        <p class="groups-label" id="groups-label">Foundations</p>
        <div id="groups" class="list grow" role="group" aria-labelledby="groups-label"></div>
        <p id="create-hint"></p>
        <button class="primary" id="create" type="button" disabled>Create variables</button>
      </section>
      <p class="error" id="error"></p>
    </main>
    <script>
      const PORT = 4317;
      const GROUPS = [
        ["color", "Color", "Color ramps"],
        ["type", "Typography", "Family, size, height, and weight"],
        ["border", "Border", "Stroke widths"],
        ["spacing", "Spacing", "Space scale"],
        ["radius", "Radius", "Corner scale"],
        ["shadow", "Shadow", "Shadow levels"],
        ["motion", "Motion", "Durations and easings"],
        ["blur", "Blur", "Blur radii"],
        ["other", "Other", "Variables outside the usual groups"],
      ];

      const errorNode = document.getElementById("error");
      const jsonError = document.getElementById("json-error");
      const pasteButton = document.getElementById("paste-continue");
      let step = 1;
      let library = [];
      let selectedId = "";
      let checksFor = "";
      let checks = {};

      function showError(message) {
        errorNode.textContent = message || "";
      }

      function groupId(variable) {
        const name = String(variable && variable.name || "");
        if (name.startsWith("color/")) return "color";
        if (name.startsWith("border/")) return "border";
        if (name.startsWith("spacing/") || name.startsWith("space/")) return "spacing";
        if (name.startsWith("radius/")) return "radius";
        if (name.startsWith("shadow/")) return "shadow";
        if (name.startsWith("motion/")) return "motion";
        if (name.startsWith("blur/")) return "blur";
        if (name.startsWith("font/") || name === "font-family" || name === "font-style") return "type";
        return "other";
      }

      function allVariables(system) {
        return (system.sets || []).flatMap((set) => (Array.isArray(set.variables) ? set.variables : []));
      }

      function selectedSystem() {
        return library.find((item) => item.id === selectedId) || null;
      }

      function showStep(next) {
        step = next;
        document.getElementById("step-read").classList.toggle("active", next === 1);
        document.getElementById("step-system").classList.toggle("active", next === 2);
        document.getElementById("step-create").classList.toggle("active", next === 3);
        showError("");
        if (next === 1) renderRead();
        if (next === 2) renderSystems();
        if (next === 3) renderCreate();
      }

      function renderRead() {
        const note = document.getElementById("loaded-note");
        const resume = document.getElementById("resume");
        const loaded = library.length > 0;
        note.hidden = !loaded;
        resume.hidden = !loaded;
        if (!loaded) return;
        note.textContent = library.length === 1
          ? `1 system is already loaded: ${library[0].name}.`
          : `${library.length} systems are already loaded.`;
      }

      function adoptLibrary(systems, options) {
        const skipSystemPick = Boolean(options && options.skipSystemPick);
        library = systems.map((system, index) => ({
          ...system,
          id: typeof system.id === "string" && system.id ? system.id : `system-${index}`,
        }));
        if (!library.some((item) => item.id === selectedId)) {
          const active = library.find((item) => item.active) || library[0];
          selectedId = active ? active.id : "";
        }
        checksFor = "";
        document.getElementById("search").value = "";
        // Paste JSON already chose the export; go straight to foundations.
        // Read from Foundry can return several systems, so keep the picker.
        showStep(skipSystemPick ? 3 : 2);
      }

      function systemsFromParsed(parsed) {
        if (!parsed || parsed.source !== "creator" || typeof parsed !== "object") return null;
        if (parsed.kind === "library" && Array.isArray(parsed.systems)) {
          const systems = parsed.systems.filter((item) => item && typeof item.name === "string" && Array.isArray(item.sets));
          return systems.length ? systems : null;
        }
        if (Array.isArray(parsed.sets)) {
          return [{
            id: typeof parsed.id === "string" ? parsed.id : "pasted",
            name: typeof parsed.name === "string" && parsed.name ? parsed.name : "Pasted system",
            active: true,
            sets: parsed.sets,
            type: parsed.type && Array.isArray(parsed.type.collections) ? parsed.type : { collections: [] },
          }];
        }
        if (parsed.kind === "type" && Array.isArray(parsed.collections)) {
          return [{
            id: "pasted-type",
            name: "Pasted text styles",
            active: true,
            sets: [],
            type: parsed,
          }];
        }
        return null;
      }

      function validateJsonField() {
        const raw = document.getElementById("json").value.trim();
        jsonError.textContent = "";
        if (!raw) {
          pasteButton.disabled = true;
          return;
        }
        try {
          JSON.parse(raw);
          pasteButton.disabled = false;
        } catch {
          pasteButton.disabled = true;
          jsonError.textContent = "That text is not valid JSON.";
        }
      }

      function visibleSystems() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        if (!query) return library;
        return library.filter((item) => String(item.name).toLowerCase().includes(query));
      }

      function renderSystems() {
        const node = document.getElementById("systems");
        const empty = document.getElementById("systems-empty");
        const matches = visibleSystems();
        node.innerHTML = "";
        empty.hidden = matches.length > 0;
        matches.forEach((system) => {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = "radio";
          input.name = "ds";
          input.checked = system.id === selectedId;
          input.onchange = () => {
            if (selectedId !== system.id) {
              selectedId = system.id;
              checksFor = "";
            }
            updateSystemActions();
          };
          const text = document.createElement("span");
          const name = document.createElement("strong");
          name.textContent = system.name;
          text.appendChild(name);
          const meta = document.createElement("em");
          const variables = allVariables(system).length;
          const bits = [`${variables} variables`];
          if (system.active) bits.push("open");
          meta.textContent = bits.join(" · ");
          label.append(input, text, meta);
          node.appendChild(label);
        });
        updateSystemActions();
      }

      function updateSystemActions() {
        const system = selectedSystem();
        document.getElementById("to-create").disabled = !system;
        document.getElementById("selected-line").textContent = system ? `Selected: ${system.name}` : "Select one system.";
      }

      function bindSystem(system) {
        if (!system || checksFor === system.id) return;
        checksFor = system.id;
        checks = {};
        allVariables(system).forEach((variable) => {
          checks[groupId(variable)] = true;
        });
      }

      function addCheck(parent, id, title, detail, countLabel) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = checks[id] === true;
        input.onchange = () => {
          checks[id] = input.checked;
          renderCreate();
        };
        const text = document.createElement("span");
        const name = document.createElement("strong");
        name.textContent = title;
        const small = document.createElement("small");
        small.textContent = detail;
        text.append(name, small);
        const meta = document.createElement("em");
        meta.textContent = countLabel;
        label.append(input, text, meta);
        parent.appendChild(label);
      }

      function renderCreate() {
        const system = selectedSystem();
        const groups = document.getElementById("groups");
        const hint = document.getElementById("create-hint");
        groups.innerHTML = "";
        if (!system) {
          hint.textContent = "Choose a design system first.";
          document.getElementById("create").disabled = true;
          return;
        }
        bindSystem(system);
        document.getElementById("create-title").textContent = system.name;
        const buckets = new Map();
        allVariables(system).forEach((variable) => {
          const id = groupId(variable);
          buckets.set(id, (buckets.get(id) || 0) + 1);
        });
        GROUPS.forEach(([id, title, detail]) => {
          const count = buckets.get(id) || 0;
          if (!count) return;
          addCheck(groups, id, title, detail, String(count));
        });
        const chosen = allVariables(system).filter((variable) => checks[groupId(variable)] === true).length;
        if (allVariables(system).length === 0) {
          hint.textContent = "This system has no variables to create.";
        } else if (chosen === 0) {
          hint.textContent = "Tick at least one foundation.";
        } else {
          hint.textContent = `Create will write ${chosen} ${chosen === 1 ? "variable" : "variables"} into Primitives.`;
        }
        document.getElementById("create").disabled = chosen === 0;
      }

      document.getElementById("back-system").onclick = () => showStep(1);
      document.getElementById("back-create").onclick = () => showStep(2);
      document.getElementById("resume").onclick = () => showStep(2);
      document.getElementById("search").oninput = () => renderSystems();
      document.getElementById("to-create").onclick = () => {
        if (!selectedSystem()) {
          showError("Choose one design system.");
          return;
        }
        showStep(3);
      };

      document.getElementById("json").oninput = () => {
        showError("");
        validateJsonField();
      };

      document.getElementById("load").onclick = async () => {
        const button = document.getElementById("load");
        showError("");
        button.disabled = true;
        button.textContent = "Reading…";
        try {
          const response = await fetch(`http://localhost:${PORT}/api/plugin`);
          const body = await response.json().catch(() => null);
          if (!response.ok || !body) throw new Error((body && body.error) || "Foundry did not respond.");
          const systems = systemsFromParsed(body);
          if (!systems) throw new Error("Foundry did not return any design systems.");
          adoptLibrary(systems);
        } catch {
          showError("Cannot reach Foundry. Open it with npm run dev, or paste JSON.");
        } finally {
          button.disabled = false;
          button.textContent = "Read from Foundry";
        }
      };

      pasteButton.onclick = () => {
        showError("");
        const raw = document.getElementById("json").value.trim();
        if (!raw) {
          jsonError.textContent = "Paste the JSON copied in Foundry.";
          pasteButton.disabled = true;
          return;
        }
        try {
          const systems = systemsFromParsed(JSON.parse(raw));
          if (!systems) {
            jsonError.textContent = "That JSON is valid, but it is not Foundry export data.";
            return;
          }
          jsonError.textContent = "";
          adoptLibrary(systems, { skipSystemPick: true });
        } catch {
          jsonError.textContent = "That text is not valid JSON.";
          pasteButton.disabled = true;
        }
      };

      document.getElementById("create").onclick = () => {
        showError("");
        const system = selectedSystem();
        if (!system) {
          showError("Choose a design system first.");
          return;
        }
        const variables = allVariables(system).filter((variable) => checks[groupId(variable)] === true);
        if (variables.length === 0) {
          showError("Tick at least one foundation.");
          return;
        }
        parent.postMessage({
          pluginMessage: {
            type: "create",
            file: {
              source: "creator",
              sets: [{ id: system.id, name: "Primitives", variables }],
            },
          },
        }, "*");
      };

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message && message.type === "error") showError(message.message);
      };

      validateJsonField();
      showStep(1);
    </script>
  </body>
</html>
